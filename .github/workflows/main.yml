name: RDP Ready - No Secrets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
        - name: Checkout Code
      uses: actions/checkout@v4

        - name: Setup RDP User - Admin - No UAC
      shell: powershell
      run: |
        Write-Host "=== Starting RDP Setup ==="

        # 1. فعل RDP
        Write-Host "Enabling Remote Desktop..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        # 2. حيد UAC نهائيا - ما يبقاش يطلب مودباس
        Write-Host "Disabling UAC..."
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA /t REG_DWORD /d 0 /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v ConsentPromptBehaviorAdmin /t REG_DWORD /d 0 /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v PromptOnSecureDesktop /t REG_DWORD /d 0 /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableInstallerDetection /t REG_DWORD /d 0 /f

        # 3. صاوب حساب RDP
        Write-Host "Creating RDP User..."
        $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $Password -FullName "RDP" -Description "RDP User"
        
        # 4. عطيه Admin - هادي هي اللي كانت ناقصة فـ القديم
        Write-Host "Adding RDP to Administrators..."
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

        Write-Host "=== RDP User Created - Admin - UAC Disabled ==="

        - name: Install Tailscale
      shell: powershell
      run: |
        Write-Host "Installing Tailscale..."
        Invoke-WebRequest -Uri https://tailscale.com/download/windows -OutFile tailscale.msi
        Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale.msi /quiet /norestart'
        Write-Host "Tailscale Installed"

        - name: Connect Tailscale
      shell: powershell
      run: |
        Write-Host "Connecting to Tailscale..."
        & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-rdp
        Start-Sleep -Seconds 5
        $IP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
        Write-Host "=========================================="
        Write-Host "RDP ADDRESS: $IP"
        Write-Host "USERNAME: RDP"
        Write-Host "PASSWORD: Your Secret Password"
        Write-Host "=========================================="

        - name: Keep Alive - 6 Hours
      shell: powershell
      run: |
        Write-Host "RDP IS READY - You can connect now"
        Write-Host "UAC is Disabled - Install anything without password"
        Start-Sleep -Seconds 21000
